    <body>
        
        <header>
            <nav>
                <a style="font-size: 33px;">BIBLIOTECH</a>

                    <div class="line1"></div>

        <main><h1>Reserva</h1>
            <a href="InserirReserva.html">
                <button class="Salvar">
                    Inserir <i class="fa-solid fa-plus"></i>
                </button>
            </a>
            
            <input class="input-busca" id="searchInput" type="text" placeholder="Buscar por Livro" oninput="busca()">
            
            <div class="container">
                <table class="table">
                    <thead>
                        <tr>
                            <th id="espaco">*</th>
                            <th scope="col" style="font-size: 23px; width: 20%;">Data Validade</th>
                            <th scope="col" style="font-size: 23px;">Data Reserva</th>
                            <th scope="col" style="font-size: 23px;">Livro</th>
                            <th scope="col" style="font-size: 23px;">Pessoa</th>
                           
                        </tr>
                    </thead>
                    <tbody class="campos-tabela">
                    </tbody>
                </table>
            </div>


            <script>

                document.addEventListener('DOMContentLoaded', function(){
                    
                })
                function fetchReserva(){
                    fetch('http://localhost:8080/Reserva')
                    .then(response => {
                        if(!response.ok){
                            throw new Error ("Erro ao buscar as Reservas")
                        }
                        return response.json()
                    })

                    .then(data => {
                        const tabela = document.querySelector(".table tbody");
                        tabela.innerHTML = "";

                        data.forEach(reserva => {
                            Promise.all([fetchPessoa(reserva.id_pessoa),fetchLivro(reserva.id_livro)])
                    .then(([pessoa,livro]) => {
                        const linha = document.createElement("tr");
                        linha.id = `reserva-${reserva.id}`;

                        linha.innerHTML = ` <td class="td-icones">
                            <i class="fa-solid fa-pen-to-square" id="editar" onclick="editar(${reserva.id}, '${reserva.data_reserva}', '${reserva.data_validade}', 
                            '${livro.Titulo}', '${pessoa.nome}')"></i> 
                            <i class="fa-solid fa-trash" id="delete" onclick="excluirRegistro(${reserva.id})"></i>
                            
                        </td>
                        <td>${formatDate(reserva.data_reserva)}</td>
                        <td>${formatDate(reserva.data_validade)}</td>
                        <td>${livro.Titulo}</td>
                        <td>${pessoa.nome}</td>
                        
                    `   
                    tabela.appendChild(linha);
                    })
                })
            })
            }
            async function confirmReserva(id,Titulo,nome,data_reserva) {
                if(!data_reserva || data_reserva === null || data_reserva === ""){
                    Swal.fire({
            title: 'Confirmar Devolução',
            text: `Deseja realmente devolver o livro "${Titulo}" emprestado para "${nome}"?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#007bff',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Sim, devolver',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await devolvervalidade(id);
            }
        });
       

    } else {
        Swal.fire({
            icon: 'error',
            title: 'Opss...',
            text: `Livro já foi devolvido no dia ${data_reserva}.`,
            confirmButtonColor: '#007bff'
        });
                }
                
            } 
            function formatDate(dateString) {
    if (!dateString) {
        return '';
    }
    const [year, month, day] = dateString.split('-');
    return `${day}/${month}/${year}`;
}
function fetchPessoa(id){
                return fetch(`http://localhost:8080/Pessoa/${id}`)
        .then(response => response.json())
        .then(data => data); 
}
            function fetchLivro(id){
                return fetch(`http://localhost:8080/Livro/${id}`)
        .then(response => response.json())
        .then(data => data); 
}
function excluirRegistro(id) {
    Swal.fire({
        title: 'Tem certeza?',
        text: "Você não poderá reverter esta ação!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            fetch(`http://localhost:8080/Reserva/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    Swal.fire(
                        'Excluído!',
                        'O registro foi excluído com sucesso.',
                        'success'
                    );
                    document.getElementById(`reserva-${id}`).remove();
                } else {
                    Swal.fire(
                        'Erro!',
                        'Houve um problema ao excluir o livro.',
                        'error'
                    );
                }
            })
            .catch(error => {
                console.error("Erro:", error);
                Swal.fire(
                    'Erro!',
                    'Não foi possível concluir a operação.',
                    'error'
                );
            });
        }
    });
}

const valoresOriginais = {};

function editar(id, data_validade, data_reserva, id_livro, Id_pessoa) {
    const linha = document.getElementById(`reserva-${id}`);
    valoresOriginais[id] = {
        data_validade,
        data_reserva,
        id_livro,
        Id_pessoa
    };

    linha.innerHTML = `
        <td class="td-icones">
            <i class="fa-solid fa-save" onclick="atualizarRegistro(${id})"></i> 
            <i class="fa-solid fa-undo" onclick="desfazerEdicao(${id})"></i>
            <i class="fa-solid fa-times" onclick="cancelarEdicao(${id})"></i>
        </td>
        <td><input type="date" id="data_validade-${id}" value="${data_validade}"></td>
        <td><input type="date" id="data_reserva-${id}" value="${data_reserva}"></td>
        <td><select id="id_livro-${id}"></select></td>
        <td><select id="id_pessoa-${id}"></select></td>
    `;

    carregarLivro(id);
    carregarPessoa(id);
}
function cancelarEdicao(id) {
    const valores = valoresOriginais[id];
    const linha = document.getElementById(`reserva-${id}`);
    
    linha.innerHTML =  `
        <td class="td-icones">
            <i class="fa-solid fa-pen-to-square" onclick="editar(${id}, '${valores.dataReserva}', '${valores.dataValidade}', '${valores.id_livro}', '${valores.id_pessoa}')"></i>
            <i class="fa-solid fa-trash" onclick="excluirRegistro(${id})"></i>
        </td>
        <td>${valores.datareserva}</td>
        <td>${valores.datavalidade}</td>
        <td>${valores.id_livro}</td>
        <td>${valores.id_pessoa}</td>
    `;
}


function desfazerEdicao(id) {
    const valores = valoresOriginais[id];
    document.getElementById(`data_validade-${id}`).value = valores.data_validade;
    document.getElementById(`data_reserva-${id}`).value = valores.data_reserva;
    document.getElementById(`livro-${id}`).value = valores.id_livro;
    document.getElementById(`pessoa-${id}`).value = valores.id_pessoa;
}

function carregarLivro(id) {
    fetch("http://localhost:8080/Livro")
        .then(response => response.json())
        .then(livro => {
            const selectlivro = document.getElementById(`id_livro-${id}`);
            livro.forEach(livro => {
                const option = document.createElement("option");
                option.value = livro.id;
                option.textContent = livro.Titulo; 
                selectlivro.appendChild(option);
            });
        })
        .catch(error => console.error("Erro ao carregar Livros:", error));
}
function carregarPessoa(id) {
    fetch("http://localhost:8080/Pessoa")
        .then(response => response.json())
        .then(pessoas => {
            const selectpessoa = document.getElementById(`id_pessoa-${id}`);
            selectpessoa.innerHTML = ""; // Limpar o conteúdo anterior
            pessoas.forEach(pessoa => {
                const option = document.createElement("option");
                option.value = pessoa.Id;
                option.textContent = pessoa.nome; 
                selectpessoa.appendChild(option);
            });
        })
        .catch(error => console.error("Erro ao carregar pessoas:", error));
}



const notyf = new Notyf();

function atualizarRegistro(id) {
    const data_reserva = document.getElementById(`data_reserva-${id}`).value;
    const data_validade = document.getElementById(`data_validade-${id}`).value;
    const id_livro = document.getElementById(`id_livro-${id}`).value;
    const id_pessoa = document.getElementById(`id_pessoa-${id}`).value;

    const atualizacao = {
        data_reserva: data_reserva,
        data_validade: data_validade,
        id_livro: id_livro,
        id_pessoa: id_pessoa
    };
    console.log("Dados da reserva a serem enviados:", atualizacao);

    return fetch(`http://localhost:8080/Reserva/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(atualizacao)
    })
    .then(response => {
        if (response.ok) {
            notyf.success("Registro de reserva atualizado com sucesso!");
            fetchReserva(); 
        } else {
            notyf.error("Erro ao atualizar o registro de reserva.");
        }
    })
    .catch(error => {
        console.error("Erro ao atualizar reserva:", error);
        notyf.error("Erro inesperado ao tentar atualizar a reserva.");
    });
}



document.addEventListener('DOMContentLoaded', fetchReserva); 



document.getElementById('searchInput').addEventListener('input', function () {

           const searchTerm = this.value.toLowerCase();
           const rows = document.querySelectorAll('.campos-tabela tr');  
           rows.forEach(row => {
               const cells = row.getElementsByTagName('td');
               let rowContainsSearchTerm = false;

               for (let i = 0; i < cells.length; i++) {
                   const cellText = cells[i].textContent.toLowerCase();
                   if (cellText.includes(searchTerm)) {
                       rowContainsSearchTerm = true;
                       break;
                   }
                 
               }
             

               row.style.display = rowContainsSearchTerm ? '' : 'none';
           });


           
       });
       
            </script>
</body>
</html>
