    <form>
<div class="Inserir">
    <H1 class="livro">Livro</H1>
   
    <label for="titulo">Título</label>
        <input type="text" id="titulo" class="input">

        <label for="isbn">ISBN</label>
        <input type="text" id="ISBN" class="input" >

        <label for="autor">Autor</label>
        <select  id="autor" class="input"><option value="">Selecione um autor</option></select><br>

        <label for="genero">Gênero</label>
        <select  id="genero" class="input"><option value="">Selecione um genero</option></select><br>

        <label for="ano-publicacao">Ano Publicação</label>
        <input type="text" id="ano-publicacao" class="input"><br>

        <label for="foto">Foto:</label>
        <input type="file" id="foto" name="foto" accept="image/*" onchange="convertImageToBase64()" required>
        <input type="hidden" id="fotoBase64" name="fotoBase64"><br><br>

        <button id="confirmar">Confirmar</button>
        <button type="reset">Cancelar</button>
</div>
