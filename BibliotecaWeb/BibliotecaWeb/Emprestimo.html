</head>

    <main>
        <h1>Empréstimo</h1>
        <a href="InserirEmprestimo.html"><button class="Salvar">
            Inserir <i class="fa-solid fa-plus"></i></button></a>
    
        <input class="input-busca" id="searchInput"
        type="text" placeholder="Buscar por Livro" oninput="busca()">
             <div class="container">
          <table class="table">
            <thead>
            <tr>
                <th id="espaco">*</th>
                <th scope="col" style="font-size: 23px; width: 30%;">Data emprestimo</th>
                <th scope="col" style="font-size: 23px; ">Data Devolução</th>
                <th scope="col" style="font-size: 23px;">Livro</th>
                <th scope="col" style="font-size: 23px;">Pessoa</th>
                <th scope="col" style="font-size: 23px;"></th>
               
                
            
            </tr>
        </thead>
                <tbody class="campos-tabela">
                 
                </tbody>
            </table>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded",function(){
                
            })

            function fetchEmprestimo(){
                fetch('http://localhost:8080/emprestimos')
            .then(response => {
                if (!response.ok){
                    throw new Error ("Erro ao buscar os livros");
                }
                return response.json();
            })   

            .then(data => {
                const tabela = document.querySelector(".table tbody");
                tabela.innerHTML = "";

                data.forEach(emprestimo => {

                    Promise.all([fetchPessoa(emprestimo.id_pessoa),fetchLivro(emprestimo.id_livro)])
                    .then(([pessoa,livro]) => {
                        const linha = document.createElement("tr");
                        linha.id = `emprestimo-${emprestimo.id}`;

                        linha.innerHTML = ` <td class="td-icones">
                            <i class="fa-solid fa-pen-to-square" id="editar" onclick="editar(${emprestimo.id}, '${emprestimo.data_emprestimo}', '${emprestimo.data_devolucao}', 
                            '${livro.Titulo}', '${pessoa.nome}')"></i> 
                            <i class="fa-solid fa-trash" id="delete" onclick="excluirRegistro(${emprestimo.id})"></i>
                            
                        </td>
                        <td>${formatDate(emprestimo.data_emprestimo)}</td>
                        <td>${formatDate(emprestimo.data_devolucao)}</td>
                        <td>${livro.Titulo}</td>
                        <td>${pessoa.nome}</td>
                        <td class="no-hover"><i class="fa-solid fa-right-left" class="btn-devolucao" onclick="confirmDevolucao(${emprestimo.id}, '${livro.nome}', '${pessoa.nome}', '${formatDate(emprestimo.data_devolucao)}')" aria-label="Devolver Empréstimo"></i></td>
                    `   
                    tabela.appendChild(linha);
                    })
                })
            })
            }
            async function confirmDevolucao(id,livro,pessoa,data_devolucao) {
                if(!data_devolucao || data_devolucao === null || data_devolucao === ""){
                    Swal.fire({
            title: 'Confirmar Devolução',
            text: `Deseja realmente devolver o livro "${livro.nome}" emprestado para "${pessoa.nome}"?`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#007bff',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Sim, devolver',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                await devolverEmprestimo(id);
            }
        });
    } else {
        Swal.fire({
            icon: 'error',
            title: 'Opss...',
            text: `Livro já foi devolvido no dia ${data_devolucao}.`,
            confirmButtonColor: '#007bff'
        });
                }
                
            } 

            function formatDate(dateString) {
    if (!dateString) {
        return '';
    }
    const [year, month, day] = dateString.split('-');
    return `${day}/${month}/${year}`;
}


            async function devolverEmprestimo(id) {
    try {
        const response = await fetch(`http://localhost:8080/emprestimos/${id}/devolver`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        if (response.ok) {
            Swal.fire({
                icon: 'success',
                title: 'Devolução Registrada!',
                text: 'A devolução foi registrada com sucesso.',
                confirmButtonColor: '#007bff'
            });
            getEmprestimos();
        } else {
            throw new Error('Erro ao registrar a devolução.');
        }
    } catch (error) {
        Swal.fire({
            icon: 'error',
            title: 'Erro',
            text: 'Não foi possível registrar a devolução.',
            confirmButtonColor: '#007bff'
        });
    }
}
            function fetchPessoa(id){
                return fetch(`http://localhost:8080/Pessoa/${id}`)
        .then(response => response.json())
        .then(data => data); 
}
            function fetchLivro(id){
                return fetch(`http://localhost:8080/Livro/${id}`)
        .then(response => response.json())
        .then(data => data); 
}


function excluirRegistro(id) {
    Swal.fire({
        title: 'Tem certeza?',
        text: "Você não poderá reverter esta ação!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#3085d6',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Sim, excluir!',
        cancelButtonText: 'Cancelar'
    }).then((result) => {
        if (result.isConfirmed) {
            fetch(`http://localhost:8080/emprestimos/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    Swal.fire(
                        'Excluído!',
                        'O livro foi excluído com sucesso.',
                        'success'
                    );
                    document.getElementById(`emprestimo-${id}`).remove();
                } else {
                    Swal.fire(
                        'Erro!',
                        'Houve um problema ao excluir o livro.',
                        'error'
                    );
                }
            })
            .catch(error => {
                console.error("Erro:", error);
                Swal.fire(
                    'Erro!',
                    'Não foi possível concluir a operação.',
                    'error'
                );
            });
        }
    });
}
        const valoresOriginais = {};

        function editar(id,data_emprestimo,data_devolucao,id_livro,Id_pessoa){
            const linha = document.getElementById(`emprestimo-${id}`);
            valoresOriginais[id] = {
       data_emprestimo,
       data_devolucao,
       id_livro,
       Id_pessoa
    };

    linha.innerHTML =  `
            <td class="td-icones">
            <i class="fa-solid fa-save" onclick="atualizarRegistro(${id})"></i> 
            <i class="fa-solid fa-undo" onclick="desfazerEdicao(${id})"></i>
            <i class="fa-solid fa-times" onclick="cancelarEdicao(${id})"></i>
            
        </td>
        <td><input type="text" id="data_emprestimo-${id}" value="${data_emprestimo}"></td>
        <td><input type="text" id="data_devolucao-${id}" value="${data_devolucao}"></td>
        <td><select id="id_livro-${id}"><option value="">Selecione um livro</option>
            </select></td>
            <td> <select id="id_pessoa-${id}"><option value="">Selecione um cliente</option>
            </select></td>

    `

carregarLivro(id)
carregarPessoa(id)

}
function cancelarEdicao(id) {
    const valores = valoresOriginais[id];
    const linha = document.getElementById(`emprestimo-${id}`);
    
    linha.innerHTML =  `
        <td class="td-icones">
            <i class="fa-solid fa-pen-to-square" onclick="editar(${id}, '${valores.dataEmprestimo}', '${valores.dataDevolucao}', '${valores.id_livro}', '${valores.id_pessoa}')"></i>
            <i class="fa-solid fa-trash" onclick="excluirRegistro(${id})"></i>
        </td>
        <td>${valores.dataEmprestimo}</td>
        <td>${valores.dataDevolucao}</td>
        <td>${valores.id_livro}</td>
        <td>${valores.id_pessoa}</td>
    `;
}
function desfazerEdicao(id) {
    const valores = valoresOriginais[id];
    document.getElementById(`data_emprestimo-${id}`).value = valores.data_emprestimo;
    document.getElementById(`data_devolucao-${id}`).value = valores.data_devolucao;
    document.getElementById(`livro-${id}`).value = valores.id_livro;
    document.getElementById(`pessoa-${id}`).value = valores.id_pessoa;
}
function carregarLivro(id) {
    fetch("http://localhost:8080/Livro")
        .then(response => response.json())
        .then(livro => {
            const selectlivro = document.getElementById(`id_livro-${id}`);
            livro.forEach(livro => {
                const option = document.createElement("option");
                option.value = livro.id;
                option.textContent = livro.Titulo; 
                selectlivro.appendChild(option);
            });
        })
        .catch(error => console.error("Erro ao carregar Livros:", error));
}
function carregarPessoa(id) {
    fetch("http://localhost:8080/Pessoa")
        .then(response => response.json())
        .then(pessoa => {
            const selectpessoa = document.getElementById(`id_pessoa-${id}`);
            pessoa.forEach(pessoa => {
                const option = document.createElement("option");
                option.value = pessoa.id;
                option.textContent = pessoa.nome; 
                selectpessoa.appendChild(option);
            });
        })
        .catch(error => console.error("Erro ao carregar pessoas:", error));
}
function atualizarRegistro(id) {
    const data_emprestimo = document.getElementById(`data_emprestimo-${id}`).value;
    const data_devolucao = document.getElementById(`data_devolucao-${id}`).value;
    const id_livro = document.getElementById(`id_livro-${id}`).value;
    const id_pessoa = document.getElementById(`id_pessoa-${id}`).value;

    

    const atualizacao = {
        data_emprestimo: data_emprestimo,
        data_devolucao: data_devolucao,
        id_pessoa: id_pessoa,
        id_livro: id_livro
       
    };


    return fetch(`http://localhost:8080/emprestimos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(atualizacao)
    })
    .then(response => {
        if (response.ok) {
            alert("Registro de empréstimo atualizado com sucesso!");
            fetchEmprestimo(); 
        } else {
            alert("Erro ao atualizar o registro de empréstimo.");
        }
    })
    .catch(error => console.error("Erro:", error));
}

document.addEventListener('DOMContentLoaded', fetchEmprestimo); 



document.getElementById('searchInput').addEventListener('input', function () {

           const searchTerm = this.value.toLowerCase();
           const rows = document.querySelectorAll('.campos-tabela tr');  
           rows.forEach(row => {
               const cells = row.getElementsByTagName('td');
               let rowContainsSearchTerm = false;

               for (let i = 0; i < cells.length; i++) {
                   const cellText = cells[i].textContent.toLowerCase();
                   if (cellText.includes(searchTerm)) {
                       rowContainsSearchTerm = true;
                       break;
                   }
                 
               }
             

               row.style.display = rowContainsSearchTerm ? '' : 'none';
           });


           
       });
       
    




        </script>

    </main>
   
</body>
</html>
